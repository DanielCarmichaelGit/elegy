# Deploys Quilt's relay to Fly (the cowove-relay app in fly.toml; see docs/hosting.md).
# Runs on pushes to main that change what the relay runs, and by hand from the Actions tab.
# Needs the FLY_API_TOKEN repository secret: `fly tokens create deploy --app cowove-relay`.
name: Relay deploy
on:
  push:
    branches: [main]
    paths: ['src/**', 'bin/**', 'assets/**', 'deploy/**', 'Dockerfile', 'fly.toml', 'package*.json', '.github/workflows/relay-deploy.yml']
  workflow_dispatch:
# One deploy at a time, and never cancel one part-way: rooms live in the one machine's memory.
concurrency:
  group: relay-deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only --app cowove-relay
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

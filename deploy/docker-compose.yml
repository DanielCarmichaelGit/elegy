# Any Linux server with Docker: relay + Caddy for automatic HTTPS.
#   1. Point a DNS name (e.g. relay.example.com) at the server.
#   2. QUILT_DOMAIN=relay.example.com QUILT_RELAY_KEY=$(openssl rand -base64 24) docker compose up -d
# See docs/hosting.md.
services:
  relay:
    image: ghcr.io/danielcarmichaelgit/quilt-relay:latest
    build: ..
    restart: unless-stopped
    environment:
      QUILT_RELAY_KEY: ${QUILT_RELAY_KEY:-}
      QUILT_TRUST_PROXY: "1"
    volumes:
      - quilt-data:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    command: caddy reverse-proxy --from ${QUILT_DOMAIN:?set QUILT_DOMAIN to your relay's domain} --to relay:4321
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
    depends_on:
      - relay
volumes:
  quilt-data:
  caddy-data:

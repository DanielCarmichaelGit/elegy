# Fly.io config for an elegy relay. See docs/hosting.md.
#   fly launch --copy-config --no-deploy   (pick a unique app name)
#   fly volumes create elegy_data --size 3
#   fly secrets set ELEGY_RELAY_KEY=$(openssl rand -base64 24)
#   fly deploy
app = "elegy-relay"
primary_region = "iad"

[env]
  ELEGY_DATA = "/data"
  ELEGY_TRUST_PROXY = "1"
  PORT = "4321"

[[mounts]]
  source = "elegy_data"
  destination = "/data"

[http_service]
  internal_port = 4321
  force_https = true
  # Sessions are long-lived WebSockets, and rooms live in this one machine's
  # memory: keep exactly one machine running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

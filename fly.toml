# Fly.io config for a quilt relay. See docs/hosting.md.
#   fly launch --copy-config --no-deploy   (pick a unique app name)
#   fly volumes create cowove_data --size 3
#   fly secrets set QUILT_RELAY_KEY=$(openssl rand -base64 24)
#   Sign-in (docs/hosting.md): the accounts API's public key, as a secret so turning it on is deliberate:
#   node scripts/relay-pass-key.mjs | fly secrets import --app cowove-relay
#   fly deploy
app = "cowove-relay"
primary_region = "iad"
# Shutdown saves every room, then gives presence reports up to 5 s to reach the accounts
# API: more than Fly's default 5 s before it kills the machine.
kill_timeout = 10

[env]
  QUILT_DATA = "/data"
  QUILT_TRUST_PROXY = "1"
  # Turn on Supabase Storage only together with the QUILT_STORAGE_KEY secret;
  # with just one of them the relay refuses to start.
  QUILT_STORAGE_URL = "https://awuikewxoddlryghvknr.supabase.co" # the "Quilt Files" project
  # Supabase's free plan caps uploads at 50 MB per file; raise this on a paid plan.
  QUILT_MAX_STORED_FILE_MB = "50"
  PORT = "4321"
  # Presence reports for people's dashboards. They also need the RELAY_API_SECRET secret
  # (node scripts/relay-api-secret.mjs sets it on this app and on quilt-api).
  QUILT_API_URL = "https://api.heyquilt.com"

[[mounts]]
  source = "cowove_data"
  destination = "/data"

[http_service]
  internal_port = 4321
  force_https = true
  # Sessions are long-lived WebSockets, and rooms live in this one machine's
  # memory: keep exactly one machine running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

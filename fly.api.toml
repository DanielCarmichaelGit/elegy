# fly.api.toml — the Quilt accounts API (separate from the relay in fly.toml).
#   fly apps create quilt-api
#   fly secrets set --app quilt-api SUPABASE_URL=… SUPABASE_SERVICE_ROLE_KEY=… QUILT_SITE_URL=… SMTP_URL=smtp://… SMTP_FROM="Quilt <invites@…>"
#   node scripts/pass-keys.mjs | fly secrets import --app quilt-api --stage   # PASS_SIGNING_KEY, never printed
#   node scripts/relay-api-secret.mjs   # RELAY_API_SECRET on this app and cowove-relay, never printed
#   fly deploy --config fly.api.toml --remote-only --ha=false
app = "quilt-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "node bin/quilt.js api"

[env]
  PORT = "8080"
  QUILT_TRUST_PROXY = "1"
  QUILT_API_PUBLIC_URL = "https://api.heyquilt.com"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Keep one machine warm: a cold start made "Approve" on /link hang for seconds.
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

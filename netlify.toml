# base is web because the repo root package.json belongs to the Electron app, not the website
[build]
  base = "web"
  command = "npm run build"
  # Resolved from the repo root, not from base
  publish = "web/.next"

[build.environment]
  NODE_VERSION = "22"

# Netlify adds this runtime itself on its build servers; declaring it lets CLI deploys build the same way
[[plugins]]
  package = "@netlify/plugin-nextjs"
